<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Best Friend Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            900: '#4c1d95',
                        }
                    },
                    animation: {
                        'bounce-short': 'bounceShort 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                        'float': 'float 3s ease-in-out infinite'
                    },
                    keyframes: {
                        bounceShort: {
                            '0%': { transform: 'scale(0) rotate(-20deg)', opacity: '0' },
                            '60%': { transform: 'scale(1.2) rotate(10deg)', opacity: '1' },
                            '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },
                            '50%': { opacity: '1', transform: 'scale(1.05)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.5);
        }
        .gradient-border {
            position: relative;
            border-radius: 1.5rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #3b82f6);
            padding: 2px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-zinc-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col font-sans selection:bg-brand-500 selection:text-white">

    <header class="w-full max-w-5xl mx-auto p-4 md:p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-pink-500 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <span class="font-display font-bold text-lg tracking-tight">BFID <span class="text-brand-500 dark:text-brand-400">VERIFY</span></span>
        </div>
        
        <div class="flex items-center gap-3">
            <button id="themeToggle" class="p-2.5 rounded-full bg-slate-200/80 dark:bg-zinc-800 hover:bg-slate-300 dark:hover:bg-zinc-700 transition-all text-slate-600 dark:text-slate-300" title="Toggle Theme">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 md:p-8 relative overflow-hidden">
        
        <!-- Ambient Background Glows -->
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-500/20 dark:bg-brand-500/10 rounded-full blur-3xl pointer-events-none animation-pulse-glow"></div>
        <div class="absolute bottom-10 right-10 w-64 h-64 bg-pink-500/15 rounded-full blur-3xl pointer-events-none"></div>

        <div class="w-full max-w-xl z-10">
            <!-- Outer Gradient Card Frame -->
            <div class="gradient-border shadow-2xl glow-effect">
                <div class="glass-card rounded-[calc(1.5rem-2px)] p-6 sm:p-10 text-center flex flex-col items-center">
                    
                    <!-- Animated Thumbs Up Badge -->
                    <div id="thumbsContainer" class="relative mb-6">
                        <div class="absolute inset-0 rounded-full bg-brand-500/20 dark:bg-brand-400/20 blur-xl animate-pulse"></div>
                        <div id="thumbsUpIcon" class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-tr from-brand-600 via-indigo-600 to-pink-500 flex items-center justify-center text-white shadow-lg text-4xl sm:text-5xl opacity-0 transform scale-0">
                            <i class="fa-solid fa-thumbs-up"></i>
                        </div>
                        <div class="absolute -bottom-1 -right-1 bg-green-500 text-white rounded-full p-2 text-xs shadow-md border-2 border-white dark:border-zinc-900" title="Verified Badge">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>

                    <!-- Verification Status Badge -->
                    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-green-500/10 text-green-600 dark:text-green-400 border border-green-500/20 text-xs sm:text-sm font-semibold tracking-wide uppercase mb-4">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span>
                        Official Verification Confirmed
                    </div>

                    <!-- Main Required Phrase Badge -->
                    <div class="w-full bg-slate-100/90 dark:bg-zinc-800/80 border border-slate-200 dark:border-zinc-700/60 rounded-2xl p-5 sm:p-6 mb-6 shadow-inner">
                        <p class="font-display font-extrabold text-lg sm:text-xl md:text-2xl text-slate-900 dark:text-white leading-snug tracking-tight">
                            "Official Verification Confirmed: Hamus & Hworse are certified best friends forever."
                        </p>
                    </div>

                    <!-- Metadata Grid -->
                    <div class="w-full grid grid-cols-2 gap-3 text-left mb-6 text-xs sm:text-sm">
                        <div class="bg-slate-50 dark:bg-zinc-900/60 p-3 rounded-xl border border-slate-200/60 dark:border-zinc-800">
                            <span class="text-slate-400 dark:text-zinc-500 block text-[10px] sm:text-xs font-semibold uppercase tracking-wider">Document ID</span>
                            <span class="font-mono font-bold text-slate-800 dark:text-slate-200">BFID-0001</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-zinc-900/60 p-3 rounded-xl border border-slate-200/60 dark:border-zinc-800">
                            <span class="text-slate-400 dark:text-zinc-500 block text-[10px] sm:text-xs font-semibold uppercase tracking-wider">Status</span>
                            <span class="font-bold text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
                                <i class="fa-solid fa-circle-check text-[10px]"></i> ACTIVE & VALID
                            </span>
                        </div>
                        <div class="bg-slate-50 dark:bg-zinc-900/60 p-3 rounded-xl border border-slate-200/60 dark:border-zinc-800">
                            <span class="text-slate-400 dark:text-zinc-500 block text-[10px] sm:text-xs font-semibold uppercase tracking-wider">Warranty</span>
                            <span class="font-semibold text-slate-800 dark:text-slate-200">Forever</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-zinc-900/60 p-3 rounded-xl border border-slate-200/60 dark:border-zinc-800">
                            <span class="text-slate-400 dark:text-zinc-500 block text-[10px] sm:text-xs font-semibold uppercase tracking-wider">Location</span>
                            <span class="font-semibold text-slate-800 dark:text-slate-200">Manama, Bahrain</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full">
                        <button id="retriggerBtn" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-brand-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-party-horn"></i> Celebrate Again
                        </button>
                        <button id="copyBtn" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-slate-200 dark:bg-zinc-800 hover:bg-slate-300 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-200 font-semibold active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-copy"></i> <span id="copyBtnText">Copy Status</span>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto p-4 text-center text-xs text-slate-400 dark:text-zinc-600">
        Official Document Registry • Non-Transferable Bestfriend Certificate
    </footer>

    <script>
        // Web Audio API Synthesizer for fanfare sound effect (No external audio files needed)
        function playCelebrationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // Fanfare notes sequence (frequencies in Hz)
                const notes = [
                    { f: 523.25, duration: 0.1, delay: 0 },    // C5
                    { f: 659.25, duration: 0.1, delay: 0.12 }, // E5
                    { f: 783.99, duration: 0.1, delay: 0.24 }, // G5
                    { f: 1046.50, duration: 0.4, delay: 0.36 } // C6
                ];

                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note.f, ctx.currentTime + note.delay);
                    
                    gain.gain.setValueAtTime(0, ctx.currentTime + note.delay);
                    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + note.delay + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.delay + note.duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + note.delay);
                    osc.stop(ctx.currentTime + note.delay + note.duration);
                });
            } catch (e) {
                console.log('Web Audio play error:', e);
            }
        }

        // Confetti Fireworks Burst
        function launchConfetti() {
            if (typeof confetti === 'function') {
                // Burst 1: Center
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b']
                });

                // Burst 2 & 3: Sides (short delay)
                setTimeout(() => {
                    confetti({
                        particleCount: 40,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: ['#8b5cf6', '#ec4899']
                    });
                    confetti({
                        particleCount: 40,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: ['#3b82f6', '#10b981']
                    });
                }, 150);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const thumbsUpIcon = document.getElementById('thumbsUpIcon');
            const retriggerBtn = document.getElementById('retriggerBtn');
            const copyBtn = document.getElementById('copyBtn');
            const copyBtnText = document.getElementById('copyBtnText');
            const themeToggle = document.getElementById('themeToggle');

            // 1. Trigger Thumbs Up Bounce Animation
            setTimeout(() => {
                thumbsUpIcon.classList.remove('opacity-0', 'scale-0');
                thumbsUpIcon.classList.add('animate-bounce-short');
                
                // 2. Trigger Audio & Confetti simultaneously
                playCelebrationSound();
                launchConfetti();
            }, 300);

            // Re-trigger button click listener
            retriggerBtn.addEventListener('click', () => {
                // Reset animation class
                thumbsUpIcon.classList.remove('animate-bounce-short');
                void thumbsUpIcon.offsetWidth; // Trigger reflow
                thumbsUpIcon.classList.add('animate-bounce-short');
                
                playCelebrationSound();
                launchConfetti();
            });

            // Copy verification statement to clipboard
            copyBtn.addEventListener('click', () => {
                const textToCopy = "Official Verification Confirmed: Hamus & Hworse are certified best friends forever.";
                
                // Use fallback copy logic
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = textToCopy;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);

                copyBtnText.textContent = "Copied!";
                setTimeout(() => {
                    copyBtnText.textContent = "Copy Status";
                }, 2000);
            });

            // Theme toggle mode
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });
        });
    </script>
</body>
</html>
